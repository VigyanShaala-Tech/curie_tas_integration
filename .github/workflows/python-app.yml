name: Backend validation

on:
  push:
    branches: ["master", "uat"]
  pull_request:
    branches: ["master", "uat"]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: python -m pip install --upgrade build ruff

      - name: Check Python syntax
        run: python -m compileall -q tas_app tas_xblock

      - name: Lint backend code and tests
        run: ruff check tas_app/curie tas_app/models.py tas_app/tasks.py tas_app/views.py tas_app/tests --ignore E402

      - name: Build installable wheel
        run: python -m build --wheel
