# GitHub Actions Workflow for Deploying Open edX Backend changes to VigyanShaala UAT EC2
# This workflow can be triggered manually from the 'Actions' tab via workflow_dispatch,
# and also triggers automatically on pushes to the "uat" branch.
# The exact UAT plugin branch is installed in the Open edX image, migrated, and tested.

name: Deploy Open edX Backend changes to VigyanShaala UAT EC2

on:
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  # Triggers deployment on push to "uat" branch
  push:
    branches:
      - uat
permissions:
  contents: read

jobs:
  deploy:
    # A merged PR already emits a push to uat; a pull_request trigger would deploy twice.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    concurrency:
      group: uat-deploy
      cancel-in-progress: false

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: uat

      - name: 🔐 Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        # Adds the SSH private key stored in repository secrets to the agent

      - name: 📩 Add EC2 host key to known_hosts
        run: |
          # Ensure the .ssh directory exists
          mkdir -p ~/.ssh
          # Fetch remote host key to prevent MITM attacks
          echo "Scanning and adding EC2 host key to known_hosts..."
          ssh-keyscan -H "${{ secrets.EC2_IP_ADDRESS }}" >> ~/.ssh/known_hosts

      - name: 🚀 Deploying Open edX to UAT EC2 Instance
        run: |
          echo "Starting deployment to UAT EC2 instance: ${{ secrets.EC2_IP_ADDRESS }}"
          ssh "${{ secrets.SSH_USERNAME }}@${{ secrets.EC2_IP_ADDRESS }}" "bash -se" << 'EOF'
            set -euo pipefail

            echo "🔹 Activating Python virtual environment for Tutor"
            # Activate the virtual environment where Tutor is installed
            source ~/tutor-env/bin/activate

            echo "🔹 Installing the UAT TAS plugin in the Open edX image"
            tutor config save --append \
              OPENEDX_EXTRA_PIP_REQUIREMENTS=git+https://github.com/VigyanShaala-Tech/curie_tas_integration.git@uat

            echo "🔹 Building Open edX Docker images with custom platform repo"
            tutor images build openedx \
              --build-arg EDX_PLATFORM_REPOSITORY=https://github.com/VigyanShaala-Tech/openedx-platform.git \
              --build-arg EDX_PLATFORM_VERSION=vigyanshaala/ulmo.1 \
              --no-cache

            echo "🔹 Starting Open edX platform using Tutor"
            tutor local start -d

            echo "🔹 Verifying the deployed plugin and applying migrations"
            tutor local exec -T lms pip show tas-integration
            tutor local exec -T lms python /openedx/edx-platform/manage.py lms migrate tas_app --noinput

            echo "🔹 Running the CURIE backend regression suite"
            tutor local exec -T lms python /openedx/edx-platform/manage.py lms test \
              tas_app.tests.test_curie_domain \
              tas_app.tests.test_curie_slice \
              tas_app.tests.test_curie_phase3 \
              tas_app.tests.test_curie_phase4 \
              tas_app.tests.test_curie_metrics \
              tas_app.tests.test_curie_submit \
              tas_app.tests.test_models \
              tas_app.tests.test_tasks \
              --keepdb --verbosity=1

            echo "🔹 Restarting Open edX services after migration"
            tutor local restart openedx

            echo "✅ Deployment completed successfully on UAT EC2 instance!"
          EOF
